name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger

concurrency:
  group: production
  cancel-in-progress: false   # never cancel a running deploy

jobs:

  # ── 1. CI gate ─────────────────────────────────────────────────────────────
  test:
    name: CI gate
    uses: ./.github/workflows/ci.yml   # reuse the existing CI workflow

  # ── 2. Build & push Docker images ─────────────────────────────────────────
  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 3. Deploy to server via SSH ────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production   # requires manual approval if configured in repo settings

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ping-n-pay

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull

            # Zero-downtime rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for backend health
            echo "Waiting for backend health..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/actuator/health/liveness > /dev/null; then
                echo "Backend healthy"
                break
              fi
              sleep 5
            done

            # Prune old images
            docker image prune -f

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to production failed on commit ${{ github.sha }}"
          # Add Slack / email notification here if desired
