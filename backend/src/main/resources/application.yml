spring:
  application:
    name: ping-n-pay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pingnpay}
    username: ${DB_USERNAME:pingnpay}
    password: ${DB_PASSWORD:pingnpay}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Mail ────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:your-sendgrid-api-key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Quartz ──────────────────────────────────────────────────────────────
  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    # Override JWT_SECRET in production with a 256-bit base64-encoded key
    # Generate with: openssl rand -base64 32
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000        # 24 hours (ms)
    refresh-expiration: 604800000  # 7 days (ms)
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@pingnpay.com}
    from-name: ${MAIL_FROM_NAME:Ping 'n Pay}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}          # e.g. +447700900000
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}      # e.g. whatsapp:+14155238886

logging:
  level:
    com.pingnpay: DEBUG
    org.springframework.security: INFO
