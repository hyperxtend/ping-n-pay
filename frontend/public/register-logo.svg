<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 2 92 92" role="img" aria-label="Register">
  <defs>
    <linearGradient id="rose" x1="0" y1="8" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9707F" />
      <stop offset="0.5" stop-color="#912F40" />
      <stop offset="1" stop-color="#702632" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#rose)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- clipboard board (right edge breaks where the pencil crosses) -->
    <path d="M56 16 H62 A5 5 0 0 1 67 21 V55
             M26 16 H20 A5 5 0 0 0 15 21 V81 A5 5 0 0 0 20 86 H62 A5 5 0 0 0 67 81" />
    <!-- clip -->
    <rect x="26" y="11" width="30" height="10" rx="2" />
    <path d="M37 11 A4 4 0 0 1 45 11" />

    <!-- avatar -->
    <circle cx="41" cy="41" r="11" />
    <circle cx="41" cy="37.5" r="3.5" />
    <path d="M34.5 49 A6.5 6.5 0 0 1 47.5 49" />

    <!-- text lines -->
    <path d="M30 63 H52 M30 71 H52" />

    <!-- pencil -->
    <g transform="translate(56 80) rotate(-45)">
      <path d="M0 0 L10 -5 H46 V5 H10 Z" />
      <path d="M38 -5 V5" />
    </g>
  </g>
</svg>
