version: "3.9"

# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# All secrets are supplied via environment variables or a .env file.
# Never commit .env to version control.

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-pingnpay}
      POSTGRES_USER:     ${DB_USERNAME:-pingnpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pingnpay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL:                   jdbc:postgresql://postgres:5432/${DB_NAME:-pingnpay}
      DB_USERNAME:              ${DB_USERNAME:-pingnpay}
      DB_PASSWORD:              ${DB_PASSWORD}
      JWT_SECRET:               ${JWT_SECRET}
      MAIL_HOST:                ${MAIL_HOST:-smtp.sendgrid.net}
      MAIL_PORT:                ${MAIL_PORT:-587}
      MAIL_USERNAME:            ${MAIL_USERNAME:-apikey}
      MAIL_PASSWORD:            ${MAIL_PASSWORD}
      MAIL_FROM:                ${MAIL_FROM:-noreply@pingnpay.com}
      TWILIO_ACCOUNT_SID:       ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:        ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER:       ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM:     ${TWILIO_WHATSAPP_FROM:-}
      STRIPE_SECRET_KEY:        ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:    ${STRIPE_WEBHOOK_SECRET:-}
      BASE_URL:                 ${BASE_URL:-https://yourdomain.com}
      CORS_ORIGINS:             ${CORS_ORIGINS:-https://yourdomain.com}
      LOG_LEVEL:                ${LOG_LEVEL:-INFO}
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Frontend (Nginx) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [internal, external]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
    internal: true   # backend/db not reachable from the host
  external:
    driver: bridge   # only nginx is exposed
